[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-data-generation"
version = "0.1.0"
description = "Synthetic VIP data generation, Bayesian analysis, and experiment tracking"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AAIF / Data Services Portfolio" }
]
dependencies = [
  "click>=8.1.7",
  "matplotlib>=3.7.1",
  "mlflow>=2.14.0",
  "numpy>=1.24.3",
  "pandas>=2.0.3",
  "pymc>=5.4.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.1",
  "seaborn>=0.12.2",
  "pytest>=7.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0"
]
notebooks = [
  "jupyterlab>=4.0.0"
]
gan = [
  "torch>=2.2.0"
]

[project.scripts]
artificial-data-generation = "src.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
