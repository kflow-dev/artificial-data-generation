[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-data-generation"
version = "0.1.0"
description = "Professional Bayesian Synthetic Data Generation Framework"
dependencies = [
    "numpy", "pandas", "scikit-learn", "pymc", "click", "matplotlib", "seaborn", "scipy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
